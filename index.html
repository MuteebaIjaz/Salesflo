<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesFlo | Custom Software & AI Automation Solutions</title>
    <meta name="description" content="We build AI-powered automation, modern web & mobile apps, and data-driven solutions to help businesses work smarter, scale faster and achieve more." />
    
    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SalesFlo | Custom Software & AI Automation Solutions" />
    <meta property="og:description" content="Custom Software Solutions for a Smarter Tomorrow. AI Automation, Modern Web & Mobile Development, and Data Analytics." />
    
    <!-- Google Fonts: Manrope (Headings) and Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F7F3] text-[#142438] antialiased selection:bg-[#B58B48]/20 selection:text-[#142438]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- SalesFlo n8n Webhook Contact Form Handler -->
    <script>
      const WEBHOOK_URL = "https://muteebaijaz.app.n8n.cloud/webhook/salesflo-lead-capture";

      document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("contactForm");
        if (!form) return;

        form.addEventListener("submit", async (e) => {
          if (e.defaultPrevented) return;
          e.preventDefault();
          const status = document.getElementById("formStatus");
          const data = Object.fromEntries(new FormData(form));
          data.consent = form.consent ? form.consent.checked : true;
          data.source = "website-contact-form";

          if (status) status.textContent = "Sending...";
          try {
            const res = await fetch(WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });
            if (!res.ok) throw new Error("Request failed");
            if (status) status.textContent = "Thank you! We'll be in touch shortly.";
            form.reset();
          } catch (err) {
            if (status) status.textContent = "Something went wrong. Please try again.";
          }
        });
      });
    </script>
  </body>
</html>
